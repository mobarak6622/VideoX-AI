name: Build & Release VideoX AI APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Signed APK Packages
        run: |
          if [ -f "VideoX-AI-release.apk" ]; then
            echo "Found pre-built signed VideoX-AI-release.apk in repository root."
            cp VideoX-AI-release.apk VideoX-AI-debug.apk
          else
            echo "No pre-built APK found; building with Gradle..."
            python3 scripts/ci_prepare_github_build.py
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk VideoX-AI-release.apk
            cp app/build/outputs/apk/debug/app-debug.apk VideoX-AI-debug.apk
          fi
          ls -lh VideoX-AI-release.apk VideoX-AI-debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoX-AI-APKs
          path: |
            VideoX-AI-release.apk
            VideoX-AI-debug.apk

      - name: Publish APKs to GitHub Releases (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VideoX AI v1.0.0 — Offline AI Video Enhancer & 4K Upscaler"
          body: |
            ## 🎬 VideoX AI v1.0.0 (Official Android Release)
            - **100% On-Device Offline AI Video Enhancer & 4K Upscaler**
            - **Package Name:** `com.videoxai.enhancer`
            - **Minimum Android Version:** Android 10+ (API 29)
            - **Direct Install:** Tap `VideoX-AI-release.apk` below to download and install on your Android phone.
          files: |
            VideoX-AI-release.apk
            VideoX-AI-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
