name: Build & Release VideoX AI APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Public Maven Versions & Signing Keystores
        run: python3 scripts/ci_prepare_github_build.py

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug & Release APKs
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle assembleDebug

      - name: Prepare APK Files for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VideoX-AI-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk VideoX-AI-release.apk
          ls -lh VideoX-AI-debug.apk VideoX-AI-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoX-AI-APKs
          path: |
            VideoX-AI-release.apk
            VideoX-AI-debug.apk

      - name: Publish APKs to GitHub Releases (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VideoX AI v1.0.0 — Offline AI Video Enhancer & 4K Upscaler"
          body: |
            ## 🎬 VideoX AI v1.0.0 (Official Android Release)
            - **100% On-Device Offline AI Video Enhancer & 4K Upscaler**
            - **Package Name:** `com.videoxai.enhancer`
            - **Minimum Android Version:** Android 10+ (API 29)
            - **Direct Install:** Tap `VideoX-AI-release.apk` below to download and install on your Android phone.
          files: |
            VideoX-AI-release.apk
            VideoX-AI-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
