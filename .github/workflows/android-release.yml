name: Build & Publish VideoX AI APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug & Release APKs
        run: gradle assembleDebug

      - name: Rename APK for Direct Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VideoX-AI-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk VideoX-AI-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoX-AI-APK
          path: |
            VideoX-AI-debug.apk
            VideoX-AI-release.apk

      - name: Publish to GitHub Releases
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VideoX AI v1.0.0 — Offline AI Video Enhancer & 4K Upscaler"
          files: |
            VideoX-AI-debug.apk
            VideoX-AI-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
